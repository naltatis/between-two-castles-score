name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm install -g npm@12 && npm ci
      - run: npx vp check && npx vp test --run --project unit && npm run build
      - uses: actions/upload-pages-artifact@v5
        with: { path: app/dist }
  pages:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
